  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Silkscreen';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9266cf87-58a0-488d-9168-e9b4ca6b913a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"906305d2-9db8-420c-b9d1-51827c95b4af\"><\u002Fscript>\n<style>\nbody{margin:0;font-family:\"Atkinson Hyperlegible\",Verdana,sans-serif;color:#111;}\ndoc-page:not(:defined){visibility:hidden}\na{color:#000080;}\na:hover{color:#c00000;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<doc-page margin=\"0.75in\">\n<div slot=\"footer\" style=\"display:flex;justify-content:space-between;font:400 11px Silkscreen,monospace;color:#000080;padding-top:8px;border-top:1px solid #c0c0c0;\">\n<span>KASSIX User Guide<\u002Fspan><span>Point of sale made simple<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"font-size:16px;line-height:1.65;\">\n\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-bottom:28px;margin-bottom:28px;border-bottom:2px solid #000080;\">\n<img src=\"275fe619-146b-4065-bfd7-1f12f305231d\" alt=\"KASSIX point of sale system\" style=\"width:320px;max-width:100%;display:block;\">\n<h1 style=\"margin:0;font-size:40px;line-height:1.1;color:#000080;\">How to use KASSIX<\u002Fh1>\n<p style=\"margin:0;font-size:19px;max-width:34em;\">A friendly, step-by-step guide for shop owners and staff. No computer experience needed. If you can use a phone, you can use KASSIX.<\u002Fp>\n<\u002Fdiv>\n\n<h2 style=\"font-size:26px;color:#000080;margin:0 0 8px;\">What’s inside<\u002Fh2>\n<ol style=\"margin:0 0 32px;padding-left:24px;columns:2;column-gap:32px;\">\n<li><a href=\"#s1\">Welcome to KASSIX<\u002Fa><\u002Fli>\n<li><a href=\"#s2\">Creating your account<\u002Fa><\u002Fli>\n<li><a href=\"#s3\">Setting up your shop<\u002Fa><\u002Fli>\n<li><a href=\"#s4\">Adding your products<\u002Fa><\u002Fli>\n<li><a href=\"#s5\">Making a sale<\u002Fa><\u002Fli>\n<li><a href=\"#s6\">Finding past sales<\u002Fa><\u002Fli>\n<li><a href=\"#s7\">Keeping track of stock<\u002Fa><\u002Fli>\n<li><a href=\"#s8\">Seeing how your shop is doing<\u002Fa><\u002Fli>\n<li><a href=\"#s9\">Logging off<\u002Fa><\u002Fli>\n<li><a href=\"#s10\">Quick answers<\u002Fa><\u002Fli>\n<li><a href=\"#s11\">Words you might see<\u002Fa><\u002Fli>\n<\u002Fol>\n\n<div style=\"background:#ffffe1;border:2px solid #000;padding:14px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.25);break-inside:avoid;margin-bottom:8px;\">\n<p style=\"margin:0;\"><b>How to read this guide.<\u002Fb> Buttons you press on screen look like this: <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Complete sale<\u002Fspan>. Yellow boxes like this one are helpful tips.<\u002Fp>\n<\u002Fdiv>\n\n<h2 id=\"s1\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;break-before:page;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 1<\u002Fspan>Welcome to KASSIX<\u002Fh2>\n<p>KASSIX is a <b>cash register on your computer, tablet or phone<\u002Fb>. It helps you:<\u002Fp>\n<ul style=\"padding-left:24px;\">\n<li>ring up customers quickly and work out their change,<\u002Fli>\n<li>print a receipt for every sale,<\u002Fli>\n<li>know how many of each product you have left,<\u002Fli>\n<li>see how much you sold today, this week and this month.<\u002Fli>\n<\u002Ful>\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">What you need<\u002Fh3>\n<ul style=\"padding-left:24px;\">\n<li>A computer, tablet or phone connected to the internet.<\u002Fli>\n<li>An email address.<\u002Fli>\n<li>A printer, only if you want paper receipts. Any printer your device already uses will work.<\u002Fli>\n<\u002Ful>\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">The menu on the left<\u002Fh3>\n<p>Once you are signed in, the menu on the left side of the screen takes you everywhere. Press a button to open that page.<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 16px;\">\n<sc-raw-thead><sc-raw-tr>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;width:32%;\">Menu button<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;\">What it’s for<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Dashboard<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">A quick look at today: money in, number of sales, low stock.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>New Sale<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">The register. Use this to serve customers.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Sales<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">A list of every sale and its receipt.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Products<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">The things you sell, with their prices.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Inventory<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">How many of each product you have. Add deliveries here.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Reports<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Totals and charts for today, this week or this month.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Settings<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Your shop name, currency, tax and time zone.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n\n<h2 id=\"s2\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 2<\u002Fspan>Creating your account<\u002Fh2>\n<p>You only do this once. When you open KASSIX you will see a window called <b>Welcome to KASSIX<\u002Fb>.<\u002Fp>\n<ol style=\"padding-left:24px;\">\n<li>Press the <b>Create account<\u002Fb> tab at the top of the window.<\u002Fli>\n<li>Type your <b>Business name<\u002Fb>, for example “Kape Kanto”. This is printed on your receipts.<\u002Fli>\n<li>Type <b>Your name<\u002Fb>. You can leave this empty if you like.<\u002Fli>\n<li>Type your <b>Email<\u002Fb> address.<\u002Fli>\n<li>Make up a <b>Password<\u002Fb> with at least 8 letters or numbers. Write it down somewhere safe.<\u002Fli>\n<li>Press <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Create account<\u002Fspan>.<\u002Fli>\n<\u002Fol>\n<div style=\"background:#ffffe1;border:2px solid #000;padding:14px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.25);break-inside:avoid;margin:16px 0;\">\n<p style=\"margin:0;\"><b>Got a message saying “We sent a confirmation link”?<\u002Fb> Open your email on the <b>same device<\u002Fb>, find the email from KASSIX, and press the link inside. That finishes your account.<\u002Fp>\n<\u002Fdiv>\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">Signing in next time<\u002Fh3>\n<ol style=\"padding-left:24px;\">\n<li>Make sure the <b>Sign in<\u002Fb> tab is selected.<\u002Fli>\n<li>Type your email and password.<\u002Fli>\n<li>Press <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Sign in<\u002Fspan>.<\u002Fli>\n<\u002Fol>\n<p>If something is typed wrong, a red box will tell you what to fix.<\u002Fp>\n\n<h2 id=\"s3\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 3<\u002Fspan>Setting up your shop<\u002Fh2>\n<p>Do this before your first sale. Press <b>Settings<\u002Fb> in the menu.<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 16px;\">\n<sc-raw-thead><sc-raw-tr>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;width:32%;\">Box<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;\">What to put in it<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Business name<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Your shop’s name. It appears at the top of every receipt.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Owner name<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Your name.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Currency<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">The money you use, for example PHP for pesos. An example price is shown underneath.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Sales tax rate (%)<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">The tax added to every sale, for example 12. Type 0 if you don’t charge tax.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Timezone<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Where your shop is, for example Asia/Manila. This decides when “today” starts and ends in your reports.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<p>Press <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Save<\u002Fspan> when you are done. Changed your mind before saving? Press <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Revert<\u002Fspan> to go back.<\u002Fp>\n\n<h2 id=\"s4\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 4<\u002Fspan>Adding your products<\u002Fh2>\n<p>Products are the things you sell. Each one becomes a button on the register.<\u002Fp>\n<ol style=\"padding-left:24px;\">\n<li>Press <b>Products<\u002Fb> in the menu.<\u002Fli>\n<li>Press the button to add a <b>New product<\u002Fb>. A small window opens.<\u002Fli>\n<li>Fill in the boxes (see the table below).<\u002Fli>\n<li>Press <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Add product<\u002Fspan>.<\u002Fli>\n<\u002Fol>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 16px;\">\n<sc-raw-thead><sc-raw-tr>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;width:32%;\">Box<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;\">What to put in it<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Name<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">What you call it, for example “Iced Coffee”.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>SKU / barcode<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Optional. The number on the product’s barcode, if it has one.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Category<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">The group it belongs to, like Drinks or Bakery. Choose “No category” if you’re not sure.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Selling price<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">What the customer pays.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Cost price<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">What you pay for one. Type 0 if you don’t know. KASSIX then shows how much you earn on each one.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Stock on hand<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">How many you have right now.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Low-stock alert at<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">KASSIX warns you when you get down to this many. For example, 5.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Available for sale<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Keep this ticked. Untick it to hide the product from the register without deleting it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"background:#ffffe1;border:2px solid #000;padding:14px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.25);break-inside:avoid;margin:16px 0;\">\n<p style=\"margin:0;\"><b>Changing a product later.<\u002Fb> Open it from the Products page, change what you need, and press <b>Save<\u002Fb>. To change how many you have, use <a href=\"#s7\">Inventory<\u002Fa> instead, so the change is written down.<\u002Fp>\n<\u002Fdiv>\n\n<h2 id=\"s5\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;break-before:page;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 5<\u002Fspan>Making a sale<\u002Fh2>\n<p>This is what you will do most of the day. Press <b>New Sale<\u002Fb> in the menu. On the left are your products. On the right is the customer’s order, called the <b>cart<\u002Fb>.<\u002Fp>\n\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">Step 1 · Add what the customer is buying<\u002Fh3>\n<ul style=\"padding-left:24px;\">\n<li><b>Tap a product<\u002Fb> to add it. Tap it again to add one more. A small blue number on the product shows how many are in the cart.<\u002Fli>\n<li>Can’t see it? Type its name in the <b>Search<\u002Fb> box at the top, scan its barcode, or tap a group like <b>Drinks<\u002Fb>.<\u002Fli>\n<li>Products running low say <b style=\"color:#c00000;\">Low: 6 left<\u002Fb>. Products with none left say <b style=\"color:#800000;\">Out of stock<\u002Fb>.<\u002Fli>\n<\u002Ful>\n\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">Step 2 · Check the order<\u002Fh3>\n<ul style=\"padding-left:24px;\">\n<li>Press <b>+<\u002Fb> or <b>−<\u002Fb> to change how many.<\u002Fli>\n<li>Press <b>×<\u002Fb> to take an item out.<\u002Fli>\n<li>Press <b>Clear<\u002Fb> to empty the whole cart and start again.<\u002Fli>\n<li>Giving a discount? Type the amount in the <b>Discount<\u002Fb> box.<\u002Fli>\n<\u002Ful>\n<p>The <b>TOTAL<\u002Fb> is shown in big green numbers on a black screen. Tax is already added.<\u002Fp>\n\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">Step 3 · Take the payment<\u002Fh3>\n<ol style=\"padding-left:24px;\">\n<li>Choose how the customer pays: <b>Cash<\u002Fb>, <b>Card<\u002Fb>, <b>GCash<\u002Fb> or <b>Other<\u002Fb>.<\u002Fli>\n<li>For cash, type the amount they handed you in <b>Cash received<\u002Fb>, or tap one of the quick buttons like <b>Exact<\u002Fb> or <b>₱500<\u002Fb>.<\u002Fli>\n<li>KASSIX works out the change for you. <b style=\"color:#008000;\">Change due<\u002Fb> in green means you give that back. <b style=\"color:#c00000;\">Short by<\u002Fb> in red means the customer still owes money.<\u002Fli>\n<\u002Fol>\n\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">Step 4 · Finish<\u002Fh3>\n<p>Press the big <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Complete sale<\u002Fspan> button. A window called <b>Sale complete<\u002Fb> shows the receipt. From there you can:<\u002Fp>\n<ul style=\"padding-left:24px;\">\n<li>press <b>Print receipt<\u002Fb> to print it,<\u002Fli>\n<li>press <b>View in Sales<\u002Fb> to see it in your list of sales,<\u002Fli>\n<li>press <b>New sale<\u002Fb> to serve the next customer.<\u002Fli>\n<\u002Ful>\n\n<div style=\"background:#ffffe1;border:2px solid #000;padding:14px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.25);break-inside:avoid;margin:20px 0;\">\n<p style=\"margin:0 0 8px;\"><b>Example.<\u002Fb> A customer buys 2 Iced Coffees (₱95 each), 1 Ensaymada (₱45) and 1 Tuna Sandwich (₱120).<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;\">\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding:3px 0;\">Items<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;text-align:right;\">₱355.00<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:3px 0;\">Tax (12%)<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;text-align:right;\">₱42.60<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:3px 0;border-top:1px dashed #000;\"><b>Total<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;border-top:1px dashed #000;text-align:right;\"><b>₱397.60<\u002Fb><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:3px 0;\">Customer pays cash<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;text-align:right;\">₱500.00<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:3px 0;\"><b style=\"color:#008000;\">Change to give back<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;text-align:right;\"><b style=\"color:#008000;\">₱102.40<\u002Fb><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<p style=\"margin:8px 0 0;\">You don’t have to do any of this maths. KASSIX does it as you tap.<\u002Fp>\n<\u002Fdiv>\n\n<h2 id=\"s6\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 6<\u002Fspan>Finding past sales<\u002Fh2>\n<p>Every sale is saved with its own receipt number, like <b style=\"font-family:'Courier New',monospace;\">R-000128<\u002Fb>. Press <b>Sales<\u002Fb> in the menu to see them all, newest first.<\u002Fp>\n<p>To find one sale, fill in any of these boxes at the top and press the <b>magnifying glass<\u002Fb> button:<\u002Fp>\n<ul style=\"padding-left:24px;\">\n<li><b>Receipt no.<\u002Fb> if you have the receipt,<\u002Fli>\n<li><b>From<\u002Fb> and <b>To<\u002Fb> to pick dates,<\u002Fli>\n<li><b>Payment<\u002Fb> to show only cash, card, GCash or other.<\u002Fli>\n<\u002Ful>\n<p>Press <b>Clear<\u002Fb> to show everything again. Press any sale in the list to open its receipt. You can print it again from there.<\u002Fp>\n<div style=\"background:#ffffe1;border:2px solid #000;padding:14px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.25);break-inside:avoid;margin:16px 0;\">\n<p style=\"margin:0;\">Old receipts never change. If you raise a price tomorrow, yesterday’s receipts still show yesterday’s price.<\u002Fp>\n<\u002Fdiv>\n\n<h2 id=\"s7\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 7<\u002Fspan>Keeping track of stock<\u002Fh2>\n<p>Every time you sell something, KASSIX takes it off your stock automatically. You only need to step in when new stock arrives or when your count doesn’t match.<\u002Fp>\n<ol style=\"padding-left:24px;\">\n<li>Press <b>Inventory<\u002Fb> in the menu.<\u002Fli>\n<li>Find the product and press <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Restock / adjust<\u002Fspan>.<\u002Fli>\n<li>Choose one of the two buttons:\n<ul style=\"padding-left:24px;margin:6px 0;\">\n<li><b>Restock<\u002Fb> when a delivery arrives. Type how many you <b>received<\u002Fb>. KASSIX adds them to what you already have.<\u002Fli>\n<li><b>Set count<\u002Fb> after counting your shelf, or when items break or go missing. Type how many are <b>really there<\u002Fb>. KASSIX replaces the old number.<\u002Fli>\n<\u002Ful>\n<\u002Fli>\n<li>Add a short note if you like, such as “Supplier delivery” or “2 damaged”.<\u002Fli>\n<li>Check the <b>New stock<\u002Fb> number shown under the box, then press <b>Save<\u002Fb>.<\u002Fli>\n<\u002Fol>\n<div style=\"background:#ffffe1;border:2px solid #000;padding:14px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.25);break-inside:avoid;margin:16px 0;\">\n<p style=\"margin:0;\"><b>Example.<\u002Fb> You have 6 Ensaymada and the baker drops off 24. Choose <b>Restock<\u002Fb> and type 24. New stock: 30.<\u002Fp>\n<\u002Fdiv>\n\n<h2 id=\"s8\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 8<\u002Fspan>Seeing how your shop is doing<\u002Fh2>\n<h3 style=\"font-size:20px;margin:16px 0 6px;\">The Dashboard<\u002Fh3>\n<p>Press <b>Dashboard<\u002Fb> for a quick look at today. At the top are four numbers:<\u002Fp>\n<ul style=\"padding-left:24px;\">\n<li><b>Today’s sales<\u002Fb> — all the money taken today.<\u002Fli>\n<li><b>Transactions<\u002Fb> — how many customers you served.<\u002Fli>\n<li><b>Avg. sale<\u002Fb> — how much each customer spent, on average.<\u002Fli>\n<li><b>Est. profit<\u002Fb> — roughly what you earned after paying for the products.<\u002Fli>\n<\u002Ful>\n<p>Below that you’ll find a chart of the last 7 days, your best sellers, your latest sales, and a <b>Low stock<\u002Fb> list of things to reorder soon.<\u002Fp>\n<h3 style=\"font-size:20px;margin:24px 0 6px;\">Reports<\u002Fh3>\n<p>Press <b>Reports<\u002Fb> to look further back. Choose <b>today<\u002Fb>, <b>this week<\u002Fb> or <b>this month<\u002Fb>. You’ll see your total money in, costs, profit, sales by hour or day, which payment methods customers used, and your best-selling products.<\u002Fp>\n\n<h2 id=\"s9\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 9<\u002Fspan>Logging off<\u002Fh2>\n<p>When you finish for the day, press <span style=\"display:inline-flex;align-items:center;padding:1px 8px;background:#c0c0c0;border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;font:700 13px Tahoma,Verdana,sans-serif;white-space:nowrap;color:#000;\">Log off<\u002Fspan> at the bottom of the menu. Always log off if other people use the same device.<\u002Fp>\n\n<h2 id=\"s10\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;break-before:page;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 10<\u002Fspan>Quick answers<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:18px;\">\n<div style=\"break-inside:avoid;\"><p style=\"margin:0;font-weight:700;\">A product isn’t showing on the register.<\u002Fp><p style=\"margin:2px 0 0;\">Open it in <b>Products<\u002Fb> and make sure <b>Available for sale<\u002Fb> is ticked. Also check that the <b>All<\u002Fb> group is selected on the register.<\u002Fp><\u002Fdiv>\n<div style=\"break-inside:avoid;\"><p style=\"margin:0;font-weight:700;\">The customer changed their mind before paying.<\u002Fp><p style=\"margin:2px 0 0;\">Use <b>−<\u002Fb>, <b>+<\u002Fb> or <b>×<\u002Fb> in the cart, or press <b>Clear<\u002Fb> to start over. Nothing is saved until you press <b>Complete sale<\u002Fb>.<\u002Fp><\u002Fdiv>\n<div style=\"break-inside:avoid;\"><p style=\"margin:0;font-weight:700;\">I pressed Complete sale twice. Is it recorded twice?<\u002Fp><p style=\"margin:2px 0 0;\">No. Each sale is recorded only once.<\u002Fp><\u002Fdiv>\n<div style=\"break-inside:avoid;\"><p style=\"margin:0;font-weight:700;\">The tax on my receipts is wrong.<\u002Fp><p style=\"margin:2px 0 0;\">Go to <b>Settings<\u002Fb> and check the <b>Sales tax rate<\u002Fb>. Type 0 if you don’t charge tax.<\u002Fp><\u002Fdiv>\n<div style=\"break-inside:avoid;\"><p style=\"margin:0;font-weight:700;\">My shop name on the receipt is wrong.<\u002Fp><p style=\"margin:2px 0 0;\">Change <b>Business name<\u002Fb> in <b>Settings<\u002Fb> and press <b>Save<\u002Fb>.<\u002Fp><\u002Fdiv>\n<div style=\"break-inside:avoid;\"><p style=\"margin:0;font-weight:700;\">“Today” in my reports starts at the wrong time.<\u002Fp><p style=\"margin:2px 0 0;\">Set the right <b>Timezone<\u002Fb> in <b>Settings<\u002Fb>.<\u002Fp><\u002Fdiv>\n<div style=\"break-inside:avoid;\"><p style=\"margin:0;font-weight:700;\">How do I print a receipt I already gave away?<\u002Fp><p style=\"margin:2px 0 0;\">Go to <b>Sales<\u002Fb>, press the sale, then press the print button.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<h2 id=\"s11\" style=\"font-size:28px;color:#000080;margin:40px 0 4px;\"><span style=\"display:block;font:700 13px Silkscreen,monospace;color:#c00000;letter-spacing:.05em;\">Part 11<\u002Fspan>Words you might see<\u002Fh2>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 16px;\">\n<sc-raw-thead><sc-raw-tr>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;width:32%;\">Word<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:8px 10px;background:#c0c0c0;border:1px solid #808080;\">What it means<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Cart<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">The list of things the customer is buying right now.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>SKU<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">A product’s code number, often the barcode.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Subtotal<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">The price of the items before tax.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Transaction<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">One completed sale.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Revenue<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">All the money customers paid, including tax.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Est. profit<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Money left after tax and what you paid for the products. “Est.” means estimated.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Margin<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Profit as a percentage of what you sold.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Stock on hand<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">How many of a product you have in the shop.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\"><b>Restock<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #c0c0c0;\">Adding new items that just arrived.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n\n<p style=\"margin-top:32px;text-align:center;font:700 14px Silkscreen,monospace;color:#000080;\">Happy selling!<\u002Fp>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
